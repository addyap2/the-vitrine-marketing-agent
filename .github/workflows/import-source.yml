name: Import source bundle
on:
  push:
    paths:
      - 'source-bundle.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project source
        run: |
          base64 -d source-bundle.txt | tar -xJ -C .
          rm source-bundle.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import complete project source' || exit 0
          git push
